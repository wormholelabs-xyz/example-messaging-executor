[package]
name = "executor-quoter-tests"
version = "0.1.0"
description = "Integration tests and benchmarks for executor-quoter"
edition = "2021"

[lib]
name = "executor_quoter_tests"

[features]
default = []

[dev-dependencies]
solana-program-test = { version = "3.1", features = ["agave-unstable-api"] }
solana-sdk = "3.0"
solana-sdk-ids = "3"
solana-compute-budget-interface = "3"
mollusk-svm = "0.12"
mollusk-svm-bencher = "0.12"
executor-requests = { git = "https://github.com/wormholelabs-xyz/example-messaging-executor", rev = "73799c7b963e25f577b6462b51fd4dfa518c0912" }

[[bench]]
name = "compute_units"
harness = false
