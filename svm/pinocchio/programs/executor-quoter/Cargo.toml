[package]
name = "executor-quoter"
version = "0.1.0"
description = "Executor Quoter - provides on-chain quote generation for cross-chain execution"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "executor_quoter"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
pinocchio = "0.9.2"
pinocchio-system = "0.4"
bytemuck = { version = "1.14", features = ["derive"] }
executor-requests = { git = "https://github.com/wormholelabs-xyz/example-messaging-executor", rev = "73799c7b963e25f577b6462b51fd4dfa518c0912" }
shank = "0.4"

[build-dependencies]
bs58 = "0.5"
